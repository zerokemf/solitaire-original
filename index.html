<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典接龍 | Klondike Solitaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="game-header">
        <div class="game-header-inner">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">🃏</span>
                <h1>經典接龍</h1>
                <span id="game-number" title="點擊切換遊戲編號 (1-32000，每局皆可解)">#1</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">移動</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">時間</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
            </div>
            <div class="actions">
                <div class="action-group">
                    <button id="new-game" class="btn btn-primary" title="開始新遊戲 (N)">新遊戲</button>
                    <button id="undo-btn" class="btn" title="復原上一步 (Ctrl+Z)">↶ 復原</button>
                    <button id="hint-toggle" class="btn btn-icon" title="提示可移動的牌 (H)" aria-label="提示">💡</button>
                </div>
                <div class="action-group">
                    <button id="zoom-out" class="btn btn-icon" title="縮小" aria-label="縮小">−</button>
                    <button id="zoom-in" class="btn btn-icon" title="放大" aria-label="放大">+</button>
                </div>
                <div class="action-group">
                    <button id="difficulty-toggle" class="btn btn-icon" title="難度: 簡單" aria-label="切換難度">📋</button>
                    <button id="theme-toggle" class="btn btn-icon" title="切換明/暗主題 (T)" aria-label="主題">🌙</button>
                    <button id="sound-toggle" class="btn btn-icon" title="開啟音效" aria-label="音效">🔇</button>
                    <button id="stats-btn" class="btn btn-icon" title="查看統計" aria-label="統計">📊</button>
                    <button id="challenge-btn" class="btn btn-icon" title="計時挑戰" aria-label="挑戰">⏱️</button>
                </div>
            </div>
        </div>
    </header>

    <div class="game-container">
        <main class="game-board">
            <div class="top-area">
                <div class="stock-waste">
                    <div id="stock" class="card-pile stock" title="點擊發牌"></div>
                    <div id="waste" class="card-pile waste"></div>
                </div>
                <div class="foundations">
                    <div id="foundation-0" class="card-pile foundation" data-suit="♠"></div>
                    <div id="foundation-1" class="card-pile foundation" data-suit="♥"></div>
                    <div id="foundation-2" class="card-pile foundation" data-suit="♦"></div>
                    <div id="foundation-3" class="card-pile foundation" data-suit="♣"></div>
                </div>
            </div>

            <div class="tableau">
                <div id="tableau-0" class="card-pile tableau-pile"></div>
                <div id="tableau-1" class="card-pile tableau-pile"></div>
                <div id="tableau-2" class="card-pile tableau-pile"></div>
                <div id="tableau-3" class="card-pile tableau-pile"></div>
                <div id="tableau-4" class="card-pile tableau-pile"></div>
                <div id="tableau-5" class="card-pile tableau-pile"></div>
                <div id="tableau-6" class="card-pile tableau-pile"></div>
            </div>
        </main>

        <!-- 勝利畫面 -->
        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 恭喜過關！</h2>
                <p>移動次數: <span id="final-moves">0</span></p>
                <p>完成時間: <span id="final-time">00:00</span></p>
                <button id="play-again" class="btn btn-large">再玩一次</button>
            </div>
        </div>

        <!-- 死局警告 -->
        <div id="deadlock-modal" class="modal hidden">
            <div class="modal-content deadlock-content">
                <h2>⚠️ 無路可走</h2>
                <p>目前沒有可行的移動了。</p>
                <p class="deadlock-hint">你可以嘗試復原幾步，或開始新遊戲。</p>
                <div class="deadlock-buttons">
                    <button id="deadlock-undo" class="btn">↶ 復原一步</button>
                    <button id="deadlock-new" class="btn btn-primary">新遊戲</button>
                    <button id="deadlock-close" class="btn btn-secondary">繼續觀察</button>
                </div>
            </div>
        </div>

        <!-- 選擇遊戲編號對話框 -->
        <div id="game-select-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎮 選擇遊戲</h2>
                <p>輸入遊戲編號 (1-32000)，或留空隨機開始</p>
                <p class="modal-hint">系統會自動確保每局皆可解</p>
                <input type="number" id="game-number-input" min="1" max="32000" placeholder="遊戲編號">
                <div class="modal-buttons">
                    <button id="game-select-ok" class="btn btn-primary">開始遊戲</button>
                    <button id="game-select-cancel" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 統計對話框 -->
        <div id="stats-modal" class="modal hidden">
            <div class="modal-content glass">
                <h2>📊 遊戲統計</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="stat-games">0</span>
                        <span class="stat-label">總遊戲數</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-wins">0</span>
                        <span class="stat-label">勝利次數</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-winrate">0%</span>
                        <span class="stat-label">勝率</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-best-time">--:--</span>
                        <span class="stat-label">最快通關</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-best-moves">-</span>
                        <span class="stat-label">最少移動</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-streak">0</span>
                        <span class="stat-label">最高連勝</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-current-streak">0</span>
                        <span class="stat-label">目前連勝</span>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button id="stats-clear" class="btn btn-secondary">清除統計</button>
                    <button id="stats-close" class="btn btn-primary">關閉</button>
                </div>
            </div>
        </div>

        <!-- 計時挑戰對話框 -->
        <div id="challenge-modal" class="modal hidden">
            <div class="modal-content glass">
                <h2>⏱️ 計時挑戰</h2>
                <p>在限時內完成遊戲，挑战你的最快速度！</p>
                <div class="challenge-options">
                    <button class="btn challenge-time" data-minutes="1">1 分鐘</button>
                    <button class="btn challenge-time" data-minutes="2">2 分鐘</button>
                    <button class="btn challenge-time" data-minutes="3">3 分鐘</button>
                    <button class="btn challenge-time" data-minutes="5">5 分鐘</button>
                </div>
                <p class="challenge-score hidden" id="challenge-score">
                    剩餘時間: <span id="challenge-timer">00:00</span>
                </p>
                <div class="modal-buttons">
                    <button id="challenge-close" class="btn btn-secondary">關閉</button>
                </div>
            </div>
        </div>

        <!-- 挑戰結果 modal（取代 alert） -->
        <div id="challenge-result-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="challenge-result-title">🎉 挑戰成功！</h2>
                <p id="challenge-result-message">用時 00:00，移動 0 次</p>
                <div class="modal-buttons">
                    <button id="challenge-result-new" class="btn btn-primary">再玩一次</button>
                    <button id="challenge-result-close" class="btn btn-secondary">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js?v=20260510"></script>
</body>
</html>
